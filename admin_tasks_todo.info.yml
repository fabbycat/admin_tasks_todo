name: 'Administrator Todo List'
machine_name: 'admin_tasks_todo'
description: 'A todo list that can be attached to entity types and bundles for use by administrators when configuring and maintaining sites. This tool can be easily configured to group tasks by type, priority, progress, entity type and bundle. It can be used as a reminder for adding fields, adding and altering help text, formats etc.'
